name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck and test
        run: |
          npm run typecheck
          npm test

      # Each architecture is built on its own so it gets its own latest-mac.yml.
      # A combined build emits ONE manifest and the last arch to finish wins, which
      # would offer Intel users an arm64 archive.
      - name: Build arm64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npx electron-vite build
          npx electron-builder --mac --arm64 --publish never
          mkdir -p artifacts
          mv release/latest-mac.yml release/latest-mac-arm64.yml
          cp release/*.dmg release/*.zip release/latest-mac-arm64.yml artifacts/
          rm -rf release

      - name: Build x64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npx electron-builder --mac --x64 --publish never
          mv release/latest-mac.yml release/latest-mac-x64.yml
          cp release/*.dmg release/*.zip release/latest-mac-x64.yml artifacts/
          rm -rf release

      - name: Inventory
        run: ls -lh artifacts/

      # Each feed must describe its OWN architecture. An arch array in
      # electron-builder.yml silently outranks the --arm64/--x64 flags, and the
      # symptom is invisible until an Intel user's update 404s, so assert it here
      # rather than discover it in the wild.
      - name: Verify the update feeds are per-architecture
        run: |
          set -euo pipefail
          arm_url=$(grep -m1 'url:' artifacts/latest-mac-arm64.yml | awk '{print $3}')
          x64_url=$(grep -m1 'url:' artifacts/latest-mac-x64.yml   | awk '{print $3}')
          echo "arm64 feed -> $arm_url"
          echo "x64   feed -> $x64_url"
          case "$arm_url" in *arm64*) ;; *) echo "::error::arm64 feed names $arm_url"; exit 1 ;; esac
          case "$x64_url" in *arm64*) echo "::error::x64 feed names the arm64 archive ($x64_url)"; exit 1 ;; esac
          test -f "artifacts/$arm_url" || { echo "::error::missing artifacts/$arm_url"; exit 1; }
          test -f "artifacts/$x64_url" || { echo "::error::missing artifacts/$x64_url"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: recruit-macos
          path: artifacts/*
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Idempotent: a rerun of a partly-failed release must not die here.
          # `create` is attempted first; if the release is already there, its
          # assets are overwritten instead.
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" artifacts/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "Jobbox ${GITHUB_REF_NAME}" \
              --notes-file .github/RELEASE_NOTES.md \
              artifacts/*
          fi

      # GitHub Releases stay the record of a release, but the repository is private
      # so their assets 404 for everyone without access. This is the public
      # distribution surface the website actually links at.
      - name: Publish to object storage
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          # Not a secret: the root user is a public literal in site/fline.json.
          AWS_ACCESS_KEY_ID: recruit
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MINIO_ROOT_PASSWORD }}
          AWS_DEFAULT_REGION: us-east-1
          AWS_EC2_METADATA_DISABLED: 'true'
          ENDPOINT: https://01a03fba-de27-71c9-8081-7cdda93c00a7-storage.apps.dev.fline.sh
          BUCKET: downloads
        run: |
          set -euo pipefail
          s3() { aws --endpoint-url "$ENDPOINT" "$@"; }

          # Idempotent: created on the first release, re-asserted on every one after.
          s3 s3api head-bucket --bucket "$BUCKET" 2>/dev/null || s3 s3 mb "s3://$BUCKET"
          s3 s3api put-bucket-policy --bucket "$BUCKET" --policy "{
            \"Version\": \"2012-10-17\",
            \"Statement\": [{
              \"Effect\": \"Allow\",
              \"Principal\": \"*\",
              \"Action\": \"s3:GetObject\",
              \"Resource\": \"arn:aws:s3:::$BUCKET/*\"
            }]
          }"

          arm_dmg=$(ls artifacts/*arm64.dmg)
          x64_dmg=$(ls artifacts/*.dmg | grep -v arm64)
          arm_zip=$(ls artifacts/*arm64-mac.zip)
          x64_zip=$(ls artifacts/*mac.zip | grep -v arm64)

          # The permanent record of this version.
          s3 s3 cp artifacts/ "s3://$BUCKET/$GITHUB_REF_NAME/" --recursive

          # Stable aliases. The website links at these forever, so shipping a
          # release makes the site current without the site being touched.
          s3 s3 cp "$arm_dmg" "s3://$BUCKET/latest/Recruit-arm64.dmg"
          s3 s3 cp "$x64_dmg" "s3://$BUCKET/latest/Recruit-x64.dmg"

          # electron-updater feeds. A manifest names its files relative to itself,
          # so each architecture's archive sits beside its own manifest.
          s3 s3 cp artifacts/latest-mac-arm64.yml "s3://$BUCKET/updates/darwin/arm64/latest-mac.yml"
          s3 s3 cp artifacts/latest-mac-x64.yml   "s3://$BUCKET/updates/darwin/x64/latest-mac.yml"
          s3 s3 cp "$arm_zip" "s3://$BUCKET/updates/darwin/arm64/$(basename "$arm_zip")"
          s3 s3 cp "$x64_zip" "s3://$BUCKET/updates/darwin/x64/$(basename "$x64_zip")"

          echo "published $GITHUB_REF_NAME to $ENDPOINT/$BUCKET"
