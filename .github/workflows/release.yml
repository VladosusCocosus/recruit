name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck and test
        run: |
          npm run typecheck
          npm test

      # Each architecture is built on its own so it gets its own latest-mac.yml.
      # A combined build emits ONE manifest and the last arch to finish wins, which
      # would offer Intel users an arm64 archive.
      - name: Build arm64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npx electron-vite build
          npx electron-builder --mac --arm64 --publish never
          mkdir -p artifacts
          mv release/latest-mac.yml release/latest-mac-arm64.yml
          cp release/*.dmg release/*.zip release/latest-mac-arm64.yml artifacts/
          rm -rf release

      - name: Build x64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npx electron-builder --mac --x64 --publish never
          mv release/latest-mac.yml release/latest-mac-x64.yml
          cp release/*.dmg release/*.zip release/latest-mac-x64.yml artifacts/
          rm -rf release

      - name: Inventory
        run: ls -lh artifacts/

      - uses: actions/upload-artifact@v4
        with:
          name: recruit-macos
          path: artifacts/*
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "Recruit ${GITHUB_REF_NAME}" \
            --notes-file .github/RELEASE_NOTES.md \
            artifacts/*
