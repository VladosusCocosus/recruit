appId: com.recruit.app
productName: Recruit
copyright: Copyright © 2026 Recruit contributors

directories:
  output: release
  buildResources: build

files:
  - out/**/*
  - package.json

# Native modules must live outside the asar archive or dlopen() cannot load them.
# better-sqlite3 ships prebuildify binaries; keytar ships N-API prebuilds.
asarUnpack:
  - "**/*.node"
  - node_modules/better-sqlite3/**
  - node_modules/keytar/**

mac:
  category: public.app-category.productivity
  darkModeSupport: true
  # No arch list here on purpose. An arch array in this file WINS over the
  # --arm64 / --x64 CLI flags, so every invocation built both architectures and
  # whichever finished last overwrote latest-mac.yml — which is exactly how the
  # x64 feed ended up describing the arm64 archive. The release workflow passes
  # the architecture per invocation instead.
  target:
    - target: dmg
    - target: zip
  # Unsigned build: no Apple Developer certificate is configured.
  # Setting identity to null stops electron-builder from attempting ad-hoc signing,
  # which produces a bundle Gatekeeper rejects more confusingly than an unsigned one.
  identity: null
  notarize: false

dmg:
  title: Recruit ${version}
  contents:
    - x: 140
      y: 180
      type: file
    - x: 400
      y: 180
      type: link
      path: /Applications

publish:
  provider: generic
  # Update feed in the fline object store, written by .github/workflows/release.yml.
  # Per-architecture on purpose: a shared feed offers Intel users an arm64 archive,
  # because electron-builder emits one manifest and the last arch to build wins.
  url: https://01a03fba-de27-71c9-8081-7cdda93c00a7-storage.apps.dev.fline.sh/downloads/updates/darwin/${arch}
  channel: latest
